name: Daily five content drafts

on:
  schedule:
    # 00:00 UTC = 07:00 WIB daily
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate five draft content packages (no API key)
        run: |
          python konten-studio/scripts/generate_daily.py
      - name: Upload daily content package
        uses: actions/upload-artifact@v4
        with:
          name: five-content-pack-${{ github.run_id }}
          path: |
            output/daily/*.md
            output/daily/*.json
          if-no-files-found: error
          retention-days: 14
